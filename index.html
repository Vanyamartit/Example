<!doctype html>

<html lang="ru">

  <head>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>10x10x10 Minecraft Style - Three.js</title>
    <link rel="icon" href="data:,">

    <style>

      html, body { height: 100%; margin: 0; }

      body { background: #0e0e10; color: #e5e5e5; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

      #app { position: fixed; inset: 0; overflow: hidden; }

      .hud { position: fixed; top: 12px; left: 12px; padding: 8px 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; backdrop-filter: blur(6px); }

      .hud b { color: #7bd88f; }

      a { color: #7bd88f; text-decoration: none; }

      a:hover { text-decoration: underline; }

      /* Crosshair */

      .crosshair {

        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);

        width: 22px; height: 22px; pointer-events: none; z-index: 10; opacity: 0.9;

      }

      .crosshair:before, .crosshair:after {

        content: ""; position: absolute; background: #ffff66; box-shadow: 0 0 2px rgba(255,255,102,0.8);

      }

      .crosshair:before { /* vertical */

        left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%);

      }

      .crosshair:after { /* horizontal */

        top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%);

      }

      #settings-menu {

        position: fixed;

        top: 50%;

        left: 50%;

        transform: translate(-50%, -50%);

        background: rgba(0, 0, 0, 0.7);

        padding: 20px;

        border-radius: 10px;

        z-index: 100;

        display: none;

        color: white;

        text-align: center;

      }

      #settings-menu label {

        display: block;

        margin-bottom: 10px;

      }

      .keybind-button {

        width: 100px;

        padding: 5px;

        margin: 5px;

        background: #333;

        border: 1px solid #555;

        color: white;

        cursor: pointer;

      }

      .keybind-button:hover {

        background: #555;

      }

      /* Hotbar */
      #hotbar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #555;
        border-radius: 5px;
      }
      .slot {
        width: 50px;
        height: 50px;
        border: 2px solid #333;
        margin: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .slot.selected {
        border-color: #fff;
        background-color: rgba(255, 255, 255, 0.2);
      }

      #main-menu, #world-settings {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.75);
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        z-index: 100;
        border: 2px solid #555;
      }

      #main-menu h1 {
        color: #fff;
        font-size: 3em;
        margin-bottom: 20px;
      }

      #main-menu button, #world-settings button {
        background-color: #4CAF50;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        width: 250px;
      }

      #world-settings h2 {
        color: #fff;
        margin-bottom: 30px;
      }

      #world-settings .setting {
        margin-bottom: 20px;
        text-align: left;
      }

      #world-settings label {
        display: block;
        margin-bottom: 10px;
        color: #ddd;
        font-size: 1.1em;
      }

      #world-settings .options {
        display: flex;
        justify-content: center;
      }

      #world-settings .option-btn {
        background-color: #333;
        border: 1px solid #555;
        width: 120px;
        margin: 0 5px;
      }

      #world-settings .option-btn.selected {
        background-color: #555;
        border-color: #777;
      }

      #start-game-btn {
        margin-top: 20px;
      }

      #crafting-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.75);
        padding: 20px;
        border-radius: 15px;
        display: none;
        align-items: center;
        z-index: 100;
        border: 2px solid #555;
      }

      #crafting-grid {
        display: grid;
        grid-template-columns: repeat(3, 50px);
        grid-gap: 5px;
        margin-right: 20px;
      }

      .crafting-slot {
        width: 50px;
        height: 50px;
        border: 2px solid #333;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }

    </style>

  </head>

  <body>

    <div id="main-menu">
      <h1>Minecraft</h1>
      <button id="create-world-btn">Создать мир</button>
    </div>

    <div id="world-settings" style="display: none;">
      <h2>Настройки мира</h2>
      <div class="setting">
        <label>Тип мира:</label>
        <div class="options">
          <button id="world-type-default" class="option-btn selected">Обычный</button>
          <button id="world-type-flat" class="option-btn">Плоский</button>
        </div>
      </div>
      <div class="setting">
        <label>Режим игры:</label>
        <div class="options">
          <button id="gamemode-survival" class="option-btn selected">Выживание</button>
          <button id="gamemode-creative" class="option-btn">Креатив</button>
        </div>
      </div>
      <button id="start-game-btn">Начать игру</button>
    </div>

    <div id="app"></div>
    <div id="inventory-container">
      <div id="inventory-grid"></div>
    </div>
    <div id="hotbar">
        <div class="slot" id="slot-1"></div>
        <div class="slot" id="slot-2"></div>
        <div class="slot" id="slot-3"></div>
        <div class="slot" id="slot-4"></div>
        <div class="slot" id="slot-5"></div>
    </div>

    <div id="crafting-container">
      <div id="crafting-grid">
        <div class="crafting-slot"></div>
        <div class="crafting-slot"></div>
        <div class="crafting-slot"></div>
        <div class="crafting-slot"></div>
        <div class="crafting-slot"></div>
        <div class="crafting-slot"></div>
        <div class="crafting-slot"></div>
        <div class="crafting-slot"></div>
        <div class="crafting-slot"></div>
      </div>
      <div id="crafting-output">
        <div class="crafting-slot"></div>
      </div>
    </div>

    <div class="crosshair" aria-hidden="true"></div>

    <div id="settings-menu">

      <label for="sensitivity-slider">Чувствительность мыши</label>

      <input type="range" id="sensitivity-slider" min="0.0005" max="0.005" step="0.0001" value="0.0025">

      <div id="keybindings">

        <h3>Управление</h3>

        <div><label>Вперед:</label><button id="bind-forward" class="keybind-button"></button></div>

        <div><label>Назад:</label><button id="bind-backward" class="keybind-button"></button></div>

        <div><label>Влево:</label><button id="bind-left" class="keybind-button"></button></div>

        <div><label>Вправо:</label><button id="bind-right" class="keybind-button"></button></div>

        <div><label>Прыжок:</label><button id="bind-jump" class="keybind-button"></button></div>

        <div><label>Бег:</label><button id="bind-sprint" class="keybind-button"></button></div>

        <div><label>Присесть:</label><button id="bind-sneak" class="keybind-button"></button></div>

      </div>

    </div>

    <div class="hud">

      <div><b>Управление</b>: ЛКМ — вращение, Колесо — зум</div>

      <div>Сцена: 8×8×4 кубов</div>

    </div>



    <script src="./vendor/three.min.js"></script>

    <script src="./js/recipes.js"></script>
    <script type="module" src="./js/main.js"></script>

  </body>

</html>
